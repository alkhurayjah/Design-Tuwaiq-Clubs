<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صور الجامعات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A893FF}a:hover{color:#CDB7FF}
</style>
</helmet>
<div dir="rtl" style="width: 1600px; height: 2240px; box-sizing: border-box; background: #160D33; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #FFFFFF; padding: 72px 80px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 52px; font-weight: 700">صور الجامعات</h1>
<p style="margin: 0; font-size: 18px; color: #CDB7FF">14 صورة من قالب "Start slide"، معروضة بنفس أسلوب شريحة البداية: الصورة بطبقة بنفسجية، والاسم أبيض على اليمين</p>
</div>
<div style="display: flex; align-items: center; gap: 20px">
<img src="/_blob/d45c19455d2ddcd8067f759614a9c7e6" alt="أندية طويق" style="height: 56px">
<div style="width: 1px; height: 44px; background: rgba(255,255,255,0.5)"></div>
<img src="/_blob/75a228a187719d7cb188a6d778e0858f" alt="أكاديمية طويق" style="height: 40px">
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="14">
<div style="position: relative; height: 260px; border-radius: 16px; overflow: hidden; background: #2A1A66">
<img src="{{p.src}}" alt="{{p.name}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; inset: 0; background: linear-gradient(270deg, rgba(30,18,61,0.15) 0%, rgba(91,63,192,0.55) 55%, rgba(30,18,61,0.85) 100%)"></div>
<div style="position: absolute; inset: 0; background: rgba(91,63,192,0.35)"></div>
<div style="position: absolute; right: 24px; bottom: 22px; left: 24px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 24px; font-weight: 700; color: #FFFFFF">{{p.name}}</span>
<span style="font-size: 14px; font-weight: 500; color: #F4A664; font-family: monospace">{{p.file}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":2240}}'>
class Component extends DCLogic {
renderVals() {
const list = [
['جامعة الملك سعود', 'ksu-king-saud', '00c6c41c8256e2f69f8c3638b1164181'],
['جامعة الإمام محمد بن سعود', 'imam-mohammad-bin-saud', '265d1157224df864dfeca6a63be04b61'],
['جامعة الإمام — البوابة', 'imam-club', '28ac91ae6525b96c8524ea0787fbd3d5'],

['جامعة الملك فهد للبترول والمعادن', 'kfupm-king-fahd-petroleum', 'acd78c88a979631218155771c3765ad6'],
['جامعة الملك خالد', 'kku-king-khalid', '43efeb43a0a6ffebfd49e8fc004bd204'],
['جامعة الملك فيصل', 'kfu-king-faisal', 'de0d53b8baf83b0865822154d0307697'],
['جامعة الإمام عبدالرحمن بن فيصل', 'iau-imam-abdulrahman', '30dd43be85cab3c302ca5c3d80b74e21'],
['جامعة الأمير سطام', 'psau-prince-sattam', '2ef0a380e8071902e757cbb872f85e26'],
['جامعة جازان', 'jazan', 'dc9176733e96b78e0e6bebff54f6590c'],
['جامعة الباحة', 'baha', '48fd0fe49c882ab2b22475b6b4a96361'],
['جامعة الحدود الشمالية', 'nbu-northern-border', 'e956d27256d9bf49e74c8c46eb2290ea'],
['جامعة نجران', 'najran', '1aa175af88c7231623731bc49a8ed74c'],
['حفل تكريم أندية طويق', 'tuwaiq-clubs-awards-ceremony', '6c0654ba6952e93702f3cc2f0ab9c313']
];
return { photos: list.map(([name, slug, id]) => ({ name, file: 'campus-' + slug + '.jpg', src: '/_blob/' + id })) };
}
}
</script>
</body>
</html>
