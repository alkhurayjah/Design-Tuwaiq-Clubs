<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Banner — X header (1500×500)</title>
<link rel="stylesheet" href="_base.css">
<style>
/* X crops the top and bottom ~60px on some screens and places the avatar bottom-left: keep content centred-right. */
.post{width:1500px;height:500px;background:linear-gradient(90deg,#4A20AE 0%,#2E1468 55%,#1F0F45 100%)}
.club{position:absolute;right:110px;top:110px;height:96px}
h1{position:absolute;right:110px;top:236px;margin:0;font-size:58px;font-weight:700;line-height:1.3}
h1 span{color:var(--post-accent-text)}
.sub{position:absolute;right:110px;top:322px;font-size:26px;color:rgba(255,255,255,.85)}
.academy{position:absolute;left:470px;top:118px;height:56px}
.corner{position:absolute;left:-26px;top:-40px;height:210px;transform:scaleY(-1)}
.handle{position:absolute;left:470px;top:330px;font-size:22px}
</style>
</head>
<body>
<div class="post">
  <img class="corner" src="../../assets/pixels/svg/club-mark-3color.svg" alt="">
  <div class="px teal" style="left:700px;top:96px;width:14px;height:14px"></div>
  <div class="px lilac" style="left:780px;top:380px;width:9px;height:9px"></div>
  <div class="px orange" style="right:44px;top:400px;width:16px;height:16px"></div>

  <img class="club" src="../../assets/logos/club/tuwaiq-club-white-no-tagline.svg" alt="Tuwaiq Club">
  <h1>أنديـة طويق <span>في [00] جامعة</span></h1>
  <div class="sub">مبادرة تقنية لطلاب الجامعات بدعم من أكاديمية طويق</div>

  <img class="academy" src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
  <div class="handle" dir="ltr"><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/x.svg)"></i></span><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/linkedin.svg)"></i></span>@TuwaiqClubs</div>
</div>
</body>
</html>
