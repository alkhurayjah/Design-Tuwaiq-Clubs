<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Club — Countdown campaign (1080×1080)</title>
<link rel="stylesheet" href="_base.css">
<style>
.post{width:1080px;height:1080px;background:linear-gradient(180deg,#1A0E4A 0%,#120934 55%,#0A0520 100%)}
.club{position:absolute;right:70px;top:60px;height:74px}
.num{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:900px;line-height:1;font-weight:700;color:rgba(70,60,220,.10);
  -webkit-text-stroke:6px rgba(120,110,255,.55);filter:drop-shadow(0 0 30px rgba(110,90,255,.55)) drop-shadow(0 0 4px rgba(170,120,255,.8))}
.obj{position:absolute;left:50%;top:250px;width:300px;height:300px;transform:translateX(-50%);color:#9FD8FF;
  filter:drop-shadow(0 0 22px rgba(124,108,240,1)) drop-shadow(0 0 60px rgba(224,124,255,.6))}
.count{position:absolute;left:0;right:0;top:590px;text-align:center;font-size:46px;font-weight:700;
  background:linear-gradient(180deg,#F7C99A,#F4A664);-webkit-background-clip:text;background-clip:text;color:transparent}
.line{position:absolute;left:0;right:0;top:660px;text-align:center;font-size:62px;line-height:1.28;font-weight:300;margin:0}
.cta{position:absolute;left:50%;transform:translateX(-50%);top:870px;width:184px;height:58px;border-radius:16px;border:2px solid #8B6CF6;
  background:rgba(124,108,240,.20);box-shadow:0 0 22px rgba(139,108,246,.6);color:#B9A6FF;font-size:26px;display:flex;align-items:center;justify-content:center}
.logos{position:absolute;right:70px;bottom:52px;height:56px}
.logos img{height:100%}
.logos .garage{height:62px}
.handle{position:absolute;left:70px;bottom:62px;font-size:20px}
</style>
</head>
<body>
<div class="post">
  <div class="num">4</div>
  <i class="ico obj" style="--src:url(../../assets/icons/academy/currentColor/code.svg)"></i>
  <img class="club" src="../../assets/logos/club/tuwaiq-club-white-no-tagline.svg" alt="Tuwaiq Club">

  <div class="px orange blur" style="left:150px;top:150px;width:90px;height:60px"></div>
  <div class="px teal blur" style="right:150px;top:330px;width:60px;height:46px"></div>
  <div class="px lilac blur" style="left:120px;top:690px;width:70px;height:60px"></div>
  <div class="px lilac" style="right:190px;top:290px;width:20px;height:20px;opacity:.8"></div>
  <div class="px teal" style="left:105px;top:630px;width:22px;height:22px;opacity:.8"></div>

  <div class="count">4 أيـــام</div>
  <p class="line">وش الفكـــرة اللي<br>تستحق أن تبدأها؟</p>
  <div class="cta">سجّل الآن</div>

  <div class="logos logo-pair">
    <img src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
    <span class="sep"></span>
    <img class="garage" src="../../assets/logos/partners/garage/garage-white.svg" alt="[الشريك]">
  </div>
  <div class="handle" dir="ltr"><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/x.svg)"></i></span><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/linkedin.svg)"></i></span>@TuwaiqClubs</div>
</div>
</body>
</html>
