<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Club — Semester harvest (1080×1350)</title>
<link rel="stylesheet" href="_base.css">
<style>
.post{width:1080px;height:1350px;background:linear-gradient(180deg,#0D0A2E 0%,#1F0F45 40%,#3A1B94 100%)}
.club{position:absolute;right:70px;top:48px;height:118px}
.uni{position:absolute;left:70px;top:52px;height:84px}
.kicker{position:absolute;right:70px;top:190px;font-size:28px;font-weight:500;color:var(--post-accent-text)}
h1{position:absolute;right:70px;left:70px;top:236px;margin:0;font-size:96px;line-height:1.2;font-weight:700}
.period{position:absolute;right:70px;top:372px;color:var(--twq-orange);font-size:24px;padding:8px 30px}
.grid{position:absolute;left:70px;right:70px;top:470px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.k{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);border-radius:26px;padding:22px 24px;display:flex;flex-direction:column;gap:4px}
.k .ico{width:40px;height:40px;color:var(--twq-teal)}
.k b{font-size:62px;font-weight:700;direction:ltr;unicode-bidi:isolate;text-align:right}
.k span{font-size:24px;color:rgba(255,255,255,.85)}
.k.hl{background:var(--twq-purple);border-color:var(--twq-purple)}
.k.hl .ico{color:#fff}
.label{position:absolute;left:70px;right:70px;top:1000px;display:flex;align-items:center;gap:24px;font-size:28px;font-weight:700}
.label i{flex:1;height:2px;background:rgba(163,128,255,.5)}
.list{position:absolute;right:70px;left:70px;top:1060px;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px;font-size:26px}
.list li{display:flex;align-items:center;gap:16px}
.list li::before{content:"";width:14px;height:14px;border-radius:15%;background:var(--twq-teal);flex:none}
.academy{position:absolute;right:70px;bottom:52px;height:46px}
.handle{position:absolute;left:70px;bottom:58px;font-size:20px}
</style>
</head>
<body>
<div class="post">
  <img class="club" src="../../assets/logos/club/universities/ksu/tuwaiq-club-ksu-white.svg" alt="Tuwaiq Club | KSU">
  <img class="uni" src="../../assets/logos/universities/ksu/ksu-white.svg" alt="[شعار الجامعة]">
  <div class="px teal" style="left:520px;top:170px;width:13px;height:13px"></div>
  <div class="px orange" style="left:30px;top:880px;width:16px;height:16px"></div>
  <div class="px lilac" style="right:34px;top:420px;width:9px;height:9px"></div>

  <div class="kicker">نادي طويق في [جامعة ...]</div>
  <h1>حصــاد الفصل</h1>
  <span class="pill period">[الفصل الأول 2026م]</span>

  <div class="grid">
    <div class="k hl"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/calendar.svg)"></i><b>[00]</b><span>فعالية</span></div>
    <div class="k"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/laptop.svg)"></i><b>[00]</b><span>ورشة عمل</span></div>
    <div class="k"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/person.svg)"></i><b>[0,000]</b><span>مستفيد</span></div>
    <div class="k"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/clock.svg)"></i><b>[000]</b><span>ساعة تدريبية</span></div>
    <div class="k"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/certificate.svg)"></i><b>[000]</b><span>شهادة</span></div>
    <div class="k"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/bulb.svg)"></i><b>[00]</b><span>متطوّع</span></div>
  </div>

  <div class="label"><span>أبرز المحطات</span><i></i></div>
  <ul class="list">
    <li>[أبرز فعالية أو إنجاز في الفصل]</li>
    <li>[شراكة أو زيارة أو مسابقة]</li>
    <li>[نتيجة أو جائزة حققها أعضاء النادي]</li>
  </ul>

  <img class="academy" src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
  <div class="handle" dir="ltr"><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/x.svg)"></i></span><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/linkedin.svg)"></i></span>@TuwaiqClubs</div>
</div>
</body>
</html>
