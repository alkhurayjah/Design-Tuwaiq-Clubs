<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Academy — Results / achievement story (1080×1920)</title>
<link rel="stylesheet" href="_base.css">
<style>
.post{width:1080px;height:1920px;background:linear-gradient(180deg,#0D0A2E 0%,#221852 38%,#3F2F86 70%,#6E62AA 100%)}
.photo{position:absolute;left:0;top:250px;width:100%;height:700px;object-fit:cover}
.fade{position:absolute;left:0;top:0;width:100%;height:980px;background:linear-gradient(180deg,#0D0A2E 0%,rgba(13,10,46,.85) 22%,rgba(34,24,82,.2) 50%,rgba(40,30,95,.55) 82%,#2A1F62 100%)}
.academy{position:absolute;right:80px;top:70px;height:62px}
.partner{position:absolute;left:80px;top:72px;height:60px}
h1{position:absolute;left:80px;right:80px;top:230px;margin:0;text-align:center;font-size:88px;line-height:1.25;font-weight:700}
h1 .hl{color:var(--post-accent-text)}
.sub{position:absolute;left:80px;right:80px;top:470px;margin:0;text-align:center;font-size:60px;line-height:1.3;font-weight:700}
.label{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:34px}
.label i{width:250px;height:2px;background:rgba(124,108,240,.6)}
.label span{background:#7C6CF0;border-radius:14px;padding:6px 44px;font-size:30px;font-weight:700}
.podium{position:absolute;left:110px;right:110px;top:1010px;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:0 18px;align-items:start}
.card{background:rgba(124,108,240,.18);border-radius:32px;text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:6px}
.card.first{background:rgba(124,108,240,.28);padding:40px 10px 56px;margin-top:-20px}
.card .rank{color:var(--post-coral);font-size:28px;font-weight:700}
.card .val{direction:ltr;unicode-bidi:isolate;font-size:44px;font-weight:700} .card.first .val{font-size:56px}
.card .team{font-size:26px;font-weight:600}
.stats{position:absolute;left:90px;right:90px;top:1480px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:20px;align-items:end;text-align:center}
.stat b{display:block;direction:ltr;unicode-bidi:isolate;color:var(--post-coral);font-size:36px;font-weight:700} .stat span{font-size:22px;color:rgba(255,255,255,.9);line-height:1.4}
.stat.big b{font-size:60px} .stat.big span{font-size:26px}
.foot{position:absolute;left:80px;bottom:70px;line-height:1.3}
.foot b{display:block;font-size:30px} .foot .handle{font-size:18px}
</style>
</head>
<body>
<div class="post">
  <img class="photo" src="../../assets/photos/events/tuwaiq-clubs-awards-ceremony.jpg" alt="[صورة الفعالية]">
  <div class="fade"></div>
  <img class="academy" src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
  <img class="partner" src="../../assets/logos/club/tuwaiq-club-white-no-tagline.svg" alt="[الشريك]">

  <h1>[اسم الحـدث]<br><span class="hl">[سطر التمييز]</span></h1>
  <p class="sub">[سطر الوصف الأول<br>بالتطويـــل]</p>

  <div class="label" style="top:930px"><i></i><span>الفائـــزون</span><i></i></div>
  <div class="podium">
    <div class="card"><span class="rank">المركز الثاني</span><span class="val">[000,000]</span><span class="team">فريق [الاسم]</span></div>
    <div class="card first"><span class="rank">المركز الأول</span><span class="val">[000,000]</span><span class="team">فريق [الاسم]</span></div>
    <div class="card"><span class="rank">المركز الثالث</span><span class="val">[00,000]</span><span class="team">فريق [الاسم]</span></div>
  </div>

  <div class="label" style="top:1390px"><i></i><span>أبرز الأرقام</span><i></i></div>
  <div class="stats">
    <div class="stat big"><b>[0,000+]</b><span>[وصف الرقم الأكبر]</span></div>
    <div class="stat"><b>[0,000+]</b><span>[وصف]</span></div>
    <div class="stat"><b>[0,000+]</b><span>[وصف]</span></div>
    <div class="stat"><b>[000,000+]</b><span>[وصف]</span></div>
  </div>

  <div class="foot"><b dir="ltr">Tuwaiq.edu.sa</b>
    <div class="handle" dir="ltr"><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/x.svg)"></i></span><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/linkedin.svg)"></i></span>TuwaiqAcademy</div></div>
</div>
</body>
</html>
