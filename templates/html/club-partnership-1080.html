<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Club — Partnership announcement (1080×1080)</title>
<link rel="stylesheet" href="_base.css">
<style>
/* Publish ONLY after the partnership is officially approved. */
.post{width:1080px;height:1080px;background:linear-gradient(180deg,#1F0F45 0%,#2E1468 50%,#4A20AE 100%)}
.club{position:absolute;right:70px;top:56px;height:74px}
.type{position:absolute;right:70px;top:196px;color:var(--post-info-teal);font-size:28px;font-weight:700;padding:10px 44px}
h1{position:absolute;right:70px;left:70px;top:280px;margin:0;font-size:72px;line-height:1.35;font-weight:700}
h1 span{color:var(--post-accent-text)}
.lockup{position:absolute;left:70px;right:70px;top:520px;height:220px;border-radius:32px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;gap:56px}
.lockup img{height:96px;max-width:330px;object-fit:contain}
.lockup .x{font-size:56px;font-weight:300;color:var(--twq-teal)}
.desc{position:absolute;right:70px;left:70px;top:785px;margin:0;font-size:26px;line-height:1.75;color:rgba(255,255,255,.92)}
.academy{position:absolute;right:70px;bottom:52px;height:46px}
.handle{position:absolute;left:70px;bottom:58px;font-size:20px}
</style>
</head>
<body>
<div class="post">
  <img class="club" src="../../assets/logos/club/tuwaiq-club-white-no-tagline.svg" alt="Tuwaiq Club">
  <div class="px teal" style="left:495px;top:155px;width:13px;height:13px"></div>
  <div class="px lilac" style="left:40px;top:470px;width:9px;height:9px"></div>
  <div class="px orange" style="right:30px;top:760px;width:16px;height:16px"></div>

  <span class="pill type">شراكـة</span>
  <h1>نادي طويق في [جامعة ...]<br><span>× [اسم الشريك]</span></h1>

  <div class="lockup">
    <img src="../../assets/logos/club/tuwaiq-club-white-no-tagline.svg" alt="Tuwaiq Club">
    <span class="x">×</span>
    <img src="../../assets/logos/partners/google/google-white.svg" alt="[شعار الشريك]">
  </div>

  <p class="desc">[سطر أو سطران عن هدف الشراكة: ورش، ومسابقات، وفرص تدريب لطلاب الجامعة في مجال ...]</p>

  <img class="academy" src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
  <div class="handle" dir="ltr"><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/x.svg)"></i></span><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/linkedin.svg)"></i></span>@TuwaiqClubs</div>
</div>
</body>
</html>
