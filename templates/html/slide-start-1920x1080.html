<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Slide — University start slide (1920×1080)</title>
<link rel="stylesheet" href="_base.css">
<style>
.post{width:1920px;height:1080px;background:#1E123D}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.3)}
.tint{position:absolute;inset:0;background:#6A55C8;mix-blend-mode:multiply;opacity:.85}
.grad{position:absolute;inset:0;background:linear-gradient(270deg,rgba(30,18,61,.05) 0%,rgba(91,63,192,.35) 45%,rgba(30,18,61,.85) 100%)}
.logos{position:absolute;right:80px;top:64px;height:64px}
.logos img{height:100%} .logos .acad{height:52px}
h1{position:absolute;right:120px;top:480px;margin:0;font-size:84px;font-weight:700}
.sub{position:absolute;right:120px;top:610px;margin:0;font-size:32px;font-weight:500;color:var(--twq-orange)}
</style>
</head>
<body>
<div class="post">
  <img class="photo" src="../../assets/photos/campus/ksu.jpg" alt="[صورة الجامعة]">
  <div class="tint"></div><div class="grad"></div>
  <div class="logos logo-pair">
    <img class="acad" src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
    <span class="sep"></span>
    <img src="../../assets/logos/club/tuwaiq-club-white-no-tagline.svg" alt="Tuwaiq Club">
  </div>
  <h1>جامعة الملك سعود</h1>
  <p class="sub">[نص فرعي]</p>
</div>
</body>
</html>
