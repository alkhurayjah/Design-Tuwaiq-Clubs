<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Club — Competition winners (1080×1350)</title>
<link rel="stylesheet" href="_base.css">
<style>
/* Team names only after the winners agree to be announced. No individual close-up photos without consent. */
.post{width:1080px;height:1350px;background:linear-gradient(180deg,#1F0F45 0%,#2E1468 45%,#4A20AE 100%)}
.club{position:absolute;right:70px;top:48px;height:118px}
.uni{position:absolute;left:70px;top:52px;height:84px}
.type{position:absolute;right:70px;top:196px;color:var(--post-info-teal);font-size:28px;font-weight:700;padding:10px 44px}
h1{position:absolute;right:70px;left:70px;top:280px;margin:0;font-size:80px;line-height:1.3;font-weight:700}
h1 span{color:var(--post-accent-text)}
.label{position:absolute;left:0;right:0;top:540px;display:flex;align-items:center;justify-content:center;gap:30px}
.label i{width:220px;height:2px;background:rgba(163,128,255,.6)}
.label span{background:#7C6CF0;border-radius:14px;padding:6px 44px;font-size:30px;font-weight:700}
.podium{position:absolute;left:70px;right:70px;top:650px;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:18px;align-items:end}
.card{border-radius:30px;text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.card .rank{font-size:26px;font-weight:700;color:var(--twq-orange)}
.card .medal{font-size:84px;font-weight:700;line-height:1}
.card .team{font-size:28px;font-weight:700}
.card .proj{font-size:21px;color:rgba(255,255,255,.8)}
.card.first{background:var(--twq-purple);border-color:#7C6CF0;padding:44px 12px 60px}
.card.first .medal{font-size:120px;color:var(--twq-teal)}
.thanks{position:absolute;right:70px;left:70px;top:1090px;margin:0;font-size:24px;line-height:1.7;text-align:center;color:rgba(255,255,255,.9)}
.academy{position:absolute;right:70px;bottom:52px;height:46px}
.handle{position:absolute;left:70px;bottom:58px;font-size:20px}
</style>
</head>
<body>
<div class="post">
  <img class="club" src="../../assets/logos/club/universities/ksu/tuwaiq-club-ksu-white.svg" alt="Tuwaiq Club | KSU">
  <img class="uni" src="../../assets/logos/universities/ksu/ksu-white.svg" alt="[شعار الجامعة]">
  <div class="px teal" style="left:495px;top:155px;width:13px;height:13px"></div>
  <div class="px lilac" style="left:36px;top:600px;width:9px;height:9px"></div>
  <div class="px orange" style="right:30px;top:1040px;width:16px;height:16px"></div>

  <span class="pill type">نتائج</span>
  <h1>الفائزون في<br><span>[اسم المسابقة / الهاكاثون]</span></h1>

  <div class="label"><i></i><span>الفائـــزون</span><i></i></div>
  <div class="podium">
    <div class="card"><span class="rank">المركز الثاني</span><span class="medal">2</span><span class="team">فريق [الاسم]</span><span class="proj">[فكرة المشروع]</span></div>
    <div class="card first"><span class="rank">المركز الأول</span><span class="medal">1</span><span class="team">فريق [الاسم]</span><span class="proj">[فكرة المشروع]</span></div>
    <div class="card"><span class="rank">المركز الثالث</span><span class="medal">3</span><span class="team">فريق [الاسم]</span><span class="proj">[فكرة المشروع]</span></div>
  </div>

  <p class="thanks">شكرًا لكل الفرق المشاركة، وللحكّام [و الشريك]، ونلقاكم في النسخة القادمة.</p>

  <img class="academy" src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
  <div class="handle" dir="ltr"><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/x.svg)"></i></span><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/linkedin.svg)"></i></span>@TuwaiqClubs</div>
</div>
</body>
</html>
