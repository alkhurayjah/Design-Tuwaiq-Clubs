<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Club — Workshop / Session card (1080×1080)</title>
<link rel="stylesheet" href="_base.css">
<style>
.post{width:1080px;height:1080px;background:linear-gradient(180deg,#1F0F45 0%,#2E1468 45%,#4A20AE 100%)}
.club{position:absolute;right:70px;top:56px;height:74px}
.partner{position:absolute;left:70px;top:58px;height:70px}
.type{position:absolute;right:70px;top:196px;color:var(--post-info-teal);font-size:28px;font-weight:700;padding:10px 44px;border-width:2px}
h1{position:absolute;right:70px;top:290px;width:880px;margin:0;font-size:68px;line-height:1.38;font-weight:700;text-align:right}
.art{position:absolute;left:96px;top:520px;width:270px;height:270px}
.art .frame{position:absolute;inset:-24px -38px -6px -10px;width:auto;height:auto}
.art .glow{position:absolute;inset:20px;border-radius:40px;background:radial-gradient(circle,rgba(111,216,255,.45),rgba(139,108,246,.25) 55%,transparent 75%);filter:blur(10px)}
.art .ico{position:absolute;inset:40px;width:auto;height:auto;color:#BFE9FF;filter:drop-shadow(0 0 18px rgba(124,108,240,.9))}
.presenter{position:absolute;right:70px;top:540px;font-size:28px;font-weight:300;color:#fff}
.presenter b{font-weight:300;color:var(--post-accent-text)}
.desc{position:absolute;right:70px;top:610px;width:500px;margin:0;font-size:24px;line-height:1.75;font-weight:400}
.info{position:absolute;left:0;right:0;top:860px;display:flex;justify-content:center;gap:22px;font-size:22px}
.info .pill{height:54px;padding:0 30px}
.info .date{color:var(--twq-orange)} .info .time{color:var(--post-info-purple)} .info .place{color:var(--post-info-teal)}
.info .ico{width:24px;height:24px}
.academy{position:absolute;right:70px;bottom:52px;height:46px}
.handle{position:absolute;left:70px;bottom:58px;font-size:20px}
</style>
</head>
<body>
<div class="post">
  <img class="club" src="../../assets/logos/club/tuwaiq-club-white-no-tagline.svg" alt="Tuwaiq Club">
  <img class="partner" src="../../assets/logos/partners/garage/garage-white.svg" alt="[الشريك]">

  <div class="px teal" style="left:495px;top:155px;width:13px;height:13px"></div>
  <div class="px lilac" style="left:64px;top:322px;width:7px;height:7px"></div>
  <div class="px lilac" style="right:28px;top:742px;width:18px;height:18px"></div>
  <div class="px teal" style="left:56px;top:822px;width:19px;height:19px"></div>

  <span class="pill type">ورشة عمل</span>
  <h1>[عنوان الورشة في سطرين<br>بخط عريض]</h1>

  <div class="art">
    <img class="frame" src="../../assets/decorations/frame-notch-orange.svg" alt="">
    <div class="glow"></div>
    <i class="ico" style="--src:url(../../assets/icons/academy/currentColor/bulb.svg)"></i>
  </div>

  <div class="presenter"><b>مقدم الورشة |</b> [م. الاسم]</div>
  <p class="desc">تعرّف على [موضوع الورشة]، واكتشف [الفائدة الأولى]، وتعلّم [الفائدة الثانية] بأسلوب عملي.</p>

  <div class="info">
    <span class="pill place"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/remote.svg)"></i>عن بُعد</span>
    <span class="pill time"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/clock.svg)"></i>[4:00 – 5:00] مساءً</span>
    <span class="pill date"><i class="ico" style="--src:url(../../assets/icons/academy/currentColor/calendar.svg)"></i>[18 نوفمبر 2026م]</span>
  </div>

  <img class="academy" src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
  <div class="handle" dir="ltr"><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/x.svg)"></i></span><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/linkedin.svg)"></i></span>@TuwaiqClubs</div>
</div>
</body>
</html>
