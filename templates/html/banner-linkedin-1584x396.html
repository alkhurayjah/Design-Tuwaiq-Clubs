<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Banner — LinkedIn cover (1584×396)</title>
<link rel="stylesheet" href="_base.css">
<style>
/* LinkedIn hides the bottom-left area behind the profile picture: keep content to the right half. */
.post{width:1584px;height:396px;background:linear-gradient(90deg,#4A20AE 0%,#2E1468 55%,#1F0F45 100%)}
.club{position:absolute;right:90px;top:72px;height:92px}
h1{position:absolute;right:90px;top:190px;margin:0;font-size:52px;font-weight:700;line-height:1.3}
h1 span{color:var(--post-accent-text)}
.sub{position:absolute;right:90px;top:268px;font-size:24px;color:rgba(255,255,255,.85)}
.academy{position:absolute;left:520px;top:70px;height:52px}
.corner{position:absolute;left:-30px;bottom:-48px;height:200px;opacity:.95}
.handle{position:absolute;left:520px;bottom:52px;font-size:22px}
</style>
</head>
<body>
<div class="post">
  <img class="corner" src="../../assets/pixels/svg/club-mark-3color.svg" alt="">
  <div class="px teal" style="left:760px;top:58px;width:14px;height:14px"></div>
  <div class="px lilac" style="left:840px;top:300px;width:9px;height:9px"></div>
  <div class="px orange" style="right:40px;top:330px;width:16px;height:16px"></div>

  <img class="club" src="../../assets/logos/club/tuwaiq-club-white-no-tagline.svg" alt="Tuwaiq Club">
  <h1>أنديـة طويق <span>في [00] جامعة</span></h1>
  <div class="sub">مبادرة تقنية لطلاب الجامعات بدعم من أكاديمية طويق</div>

  <img class="academy" src="../../assets/logos/academy/tuwaiq-academy-horizontal-white.svg" alt="أكاديمية طويق">
  <div class="handle" dir="ltr"><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/x.svg)"></i></span><span class="box"><i class="ico" style="--src:url(../../assets/icons/social/linkedin.svg)"></i></span>@TuwaiqClubs</div>
</div>
</body>
</html>
